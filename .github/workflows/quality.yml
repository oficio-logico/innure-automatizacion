name: Validar cambios

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el código
        run: npm run lint

      - name: Comprobar tipos, recorridos y receptor sin enviar correo
        run: |
          npx tsc --noEmit
          node --test scripts/*.test.mjs
          php -l server/contacto.php
          php scripts/contact.test.php

      - name: Construir la versión comercial
        env:
          INNURE_SOURCE_SHA: ${{ github.sha }}
          INNURE_TARGET: home
        run: npm run build:innure
